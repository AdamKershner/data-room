<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Kahana — Open from your hub</title>
    <style>
      :root {
        --ink: #313400;
        --green: #495800;
        --leaf: #7a9200;
        --paper: #f8faf2;
        --card: #fffef8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(251, 220, 142, 0.35), transparent 55%),
          linear-gradient(145deg, #7a9200 0%, #495800 58%, #313400 100%);
        padding: 48px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        max-width: 440px;
        background: var(--card);
        border-radius: 16px;
        padding: 28px 26px 24px;
        box-shadow: 0 18px 40px rgba(49, 52, 0, 0.18);
      }
      h1 { font-size: 1.45rem; margin: 0 0 10px; }
      p {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 16px;
        color: #5c6340;
      }
      a {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 650;
        color: var(--green);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Open this from Kahana</h1>
      <p>
        The company knowledge base is only available inside a private hub.
        Sign in to Kahana and open the hub you were invited to.
      </p>
      <p>
        <a href="https://curio.store">Go to Kahana</a>
      </p>
    </div>
  </body>
</html>
